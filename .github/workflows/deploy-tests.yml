name: Publish Residim numbered tests
on:
  push:
    branches: [main]
    paths: ["t/**", "scripts/design_lab.py", ".github/workflows/deploy-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: residim-tests-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER_RESIDIM }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME_RESIDIM }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD_RESIDIM_IR }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check immutable tests and source
        env:
          BASE_REF: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 scripts/design_lab.py --check
          if [ -z "$BASE_REF" ] || [[ "$BASE_REF" =~ ^0+$ ]]; then BASE_REF="HEAD^"; fi
          python3 scripts/design_lab.py --check --base-ref "$BASE_REF"
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find t -name '*.js' -print0)
          python3 -c 'import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path("t").rglob("*.webmanifest")]'
      - name: Publish only numbered test folders and index
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          server="${FTP_SERVER#ftp://}"
          server="${server#ftps://}"
          server="${server%/}"
          # The account document root was byte-verified as . on 2026-10-04.
          # Retain the existing dev FTPS certificate exception; no host files are deleted.
          common=(--fail --silent --show-error --connect-timeout 15 --max-time 75 --retry 2 --retry-delay 2 --ftp-pasv --ftp-method multicwd --ssl-reqd --insecure --user "$FTP_USERNAME:$FTP_PASSWORD")
          # multicwd creates each parent directory; singlecwd cannot create a new nested tree.
          upload_verified() {
            local source="$1" target="$2" temp rc=0
            temp="$(mktemp)"
            # Frozen snapshots are read-only once present, even for identical content.
            if [[ "$target" =~ ^t/[0-9]+/ ]]; then
              if curl "${common[@]}" --output "$temp" "ftp://$server/$target"; then
                if cmp -s "$source" "$temp"; then
                  echo "Unchanged, no write: $target"
                  rm -f "$temp"
                  return 0
                fi
                rm -f "$temp"
                echo "Refusing to overwrite immutable remote file: $target"
                return 1
              else
                rc=$?
                # curl 78 means the remote file does not exist; other errors must stop.
                if [ "$rc" -ne 78 ]; then rm -f "$temp"; return "$rc"; fi
                rc=0
              fi
            fi
            curl "${common[@]}" --ftp-create-dirs --upload-file "$source" "ftp://$server/$target" || rc=$?
            # Some servers return code 56 after successfully accepting STOR.
            if curl "${common[@]}" --output "$temp" "ftp://$server/$target" && cmp -s "$source" "$temp"; then
              echo "Verified: $target"
              rm -f "$temp"
            else
              rm -f "$temp"
              echo "Read-back failed: $target (upload code $rc)"
              return 1
            fi
          }
          # Publish dependencies first, then snapshot pages; launcher last.
          while IFS= read -r -d '' file; do upload_verified "$file" "$file"; done < <(find t -mindepth 2 -type f ! -name '*.html' ! -name '*.htm' ! -name '*.md' ! -name 'tests.json' -print0)
          while IFS= read -r -d '' file; do upload_verified "$file" "$file"; done < <(find t -mindepth 2 -type f \( -name '*.html' -o -name '*.htm' \) -print0)
          printf 'residim-tests=ok\ncommit=%s\n' "$GITHUB_SHA" > /tmp/residim-tests-health.txt
          upload_verified /tmp/residim-tests-health.txt t/health.txt
          upload_verified t/index.htm t/index.htm
          upload_verified t/index.html t/index.html
          echo "Numbered test publication and byte verification passed."
