name: Deploy Residim product

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "app/**"
      - "BACKLOG.md"
      - "README.md"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: residim-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER_RESIDIM }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME_RESIDIM }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD_RESIDIM_IR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate source and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" || { echo "FTP_SERVER_RESIDIM is empty"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "FTP_USERNAME_RESIDIM is empty"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "FTP_PASSWORD_RESIDIM_IR is empty"; exit 1; }
          test -f landing/index.html
          test -f app/index.html
          test -f app/manifest.webmanifest
          test -f app/sw.js
          test -f app/api/index.php

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check landing/landing.js
          node --check app/app.js
          if command -v php >/dev/null 2>&1; then
            find app/api -maxdepth 1 -name '*.php' ! -name 'config.local.php' -print0 | xargs -0 -n1 php -l
          fi
          python - <<'PY'
          import json
          json.load(open('app/manifest.webmanifest', encoding='utf-8'))
          print('manifest ok')
          PY

      - name: Build deploy marker
        shell: bash
        run: |
          set -euo pipefail
          printf 'residim=ok\ncommit=%s\nbuilt=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/residim-health.txt

      - name: Detect writable web root and deploy
        shell: bash
        run: |
          set -euo pipefail
          server="$FTP_SERVER"
          server="${server#ftp://}"
          server="${server#ftps://}"
          server="${server%/}"

          common=(--fail --show-error --silent --connect-timeout 20 --max-time 120 --retry 4 --retry-delay 2 --retry-all-errors --ftp-pasv --ssl-reqd --insecure --user "$FTP_USERNAME:$FTP_PASSWORD")
          probe_common=(--fail --silent --connect-timeout 8 --max-time 15 --ftp-pasv --ssl-reqd --insecure --user "$FTP_USERNAME:$FTP_PASSWORD")

          # Do not list the FTP account in public logs. Probe only common web-root paths,
          # without creating them, and keep the selected path in the runner environment.
          root=""
          for candidate in "" "public_html" "www" "htdocs" "domains/residim.ir/public_html"; do
            prefix=""
            [[ -n "$candidate" ]] && prefix="$candidate/"
            if curl "${probe_common[@]}" --upload-file /tmp/residim-health.txt "ftp://$server/${prefix}residim-probe.txt" >/dev/null 2>&1; then
              root="$candidate"
              break
            fi
          done
          if [[ -z "$root" ]]; then
            # Empty root is represented by a sentinel so it can still be distinguished
            # from "no candidate succeeded".
            if curl "${probe_common[@]}" --upload-file /tmp/residim-health.txt "ftp://$server/residim-probe.txt" >/dev/null 2>&1; then
              root="."
            else
              echo "No writable web-root candidate found. FTP credentials work for the isolated smoke directory, but not the expected web root."
              exit 1
            fi
          fi

          if [[ "$root" == "." ]]; then base=""; else base="$root/"; fi
          echo "Selected deploy root: ${root}"

          upload() {
            local src="$1" dst="$2"
            curl "${common[@]}" --ftp-create-dirs --upload-file "$src" "ftp://$server/${base}${dst}"
          }

          # Assets first, HTML last: users never see a landing page whose assets are missing.
          upload /tmp/residim-health.txt health.txt
          upload landing/landing.css assets/landing.css
          upload landing/landing.js assets/landing.js
          upload landing/residim-mark.svg assets/residim-mark.svg

          while IFS= read -r -d '' file; do
            rel="${file#app/}"
            [[ "$rel" == "storage/.gitkeep" ]] && continue
            [[ "$rel" == "api/config.local.php" ]] && continue
            upload "$file" "app/$rel"
          done < <(find app -type f -print0)
          upload /tmp/residim-health.txt app/health.txt
          upload landing/index.html index.html

          check="$(curl "${common[@]}" "ftp://$server/${base}health.txt")"
          grep -F "commit=$GITHUB_SHA" <<< "$check"
          appcheck="$(curl "${common[@]}" "ftp://$server/${base}app/health.txt")"
          grep -F "commit=$GITHUB_SHA" <<< "$appcheck"
          echo "Residim landing and /app FTP read-back passed."
