name: Deploy Residim product

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "app/**"
      - "test/**"
      - "scripts/design_lab.py"
      - "BACKLOG.md"
      - "README.md"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: residim-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER_RESIDIM }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME_RESIDIM }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD_RESIDIM_IR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate source and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" || { echo "FTP_SERVER_RESIDIM is empty"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "FTP_USERNAME_RESIDIM is empty"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "FTP_PASSWORD_RESIDIM_IR is empty"; exit 1; }
          test -f landing/index.html
          test -f app/index.html
          test -f app/manifest.webmanifest
          test -f app/sw.js
          test -f app/api/index.php

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check landing/landing.js
          node --check app/app.js
          node --check test/assets/v1/lab.js
          node --check test/sw.js
          python3 scripts/design_lab.py --check
          if command -v php >/dev/null 2>&1; then
            find app/api -maxdepth 1 -name '*.php' ! -name 'config.local.php' -print0 | xargs -0 -n1 php -l
          fi
          python - <<'PY'
          import json
          json.load(open('app/manifest.webmanifest', encoding='utf-8'))
          print('manifest ok')
          PY

      - name: Build deploy marker
        shell: bash
        run: |
          set -euo pipefail
          printf 'residim=ok\ncommit=%s\nbuilt=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/residim-health.txt

      - name: Detect writable web root and deploy
        shell: bash
        run: |
          set -euo pipefail
          server="$FTP_SERVER"
          server="${server#ftp://}"
          server="${server#ftps://}"
          server="${server%/}"

          common=(--fail --show-error --silent --connect-timeout 20 --max-time 120 --retry 2 --retry-delay 2 --ftp-pasv --ssl-reqd --insecure --user "$FTP_USERNAME:$FTP_PASSWORD")
          probe_common=(--fail --silent --connect-timeout 8 --max-time 20 --ftp-pasv --ssl-reqd --insecure --user "$FTP_USERNAME:$FTP_PASSWORD")

          # Some shared FTP servers accept the uploaded bytes but close the control
          # response in a way curl reports as code 56. Always verify the remote bytes
          # before declaring an upload failed.
          verified_put() {
            local src="$1" url="$2"
            local rc=0 tmp
            tmp="$(mktemp)"
            set +e
            curl "${common[@]}" --ftp-create-dirs --upload-file "$src" "$url"
            rc=$?
            set -e
            if [[ $rc -eq 0 ]]; then rm -f "$tmp"; return 0; fi

            if curl "${probe_common[@]}" --output "$tmp" "$url" >/dev/null 2>&1 && cmp -s "$src" "$tmp"; then
              echo "Upload verified after non-zero FTP completion code: $rc"
              rm -f "$tmp"
              return 0
            fi
            rm -f "$tmp"
            return "$rc"
          }

          probe_root() {
            local prefix="$1" method="$2" url tmp rc=0
            tmp="$(mktemp)"
            url="ftp://$server/${prefix}residim-probe.txt"
            set +e
            if [[ "$method" == "singlecwd" ]]; then
              curl "${probe_common[@]}" --ftp-method singlecwd --upload-file /tmp/residim-health.txt "$url" >/dev/null 2>&1
            elif [[ "$method" == "nocwd" ]]; then
              curl "${probe_common[@]}" --ftp-method nocwd --upload-file /tmp/residim-health.txt "$url" >/dev/null 2>&1
            else
              curl "${probe_common[@]}" --upload-file /tmp/residim-health.txt "$url" >/dev/null 2>&1
            fi
            rc=$?
            set -e
            if [[ $rc -eq 0 ]]; then rm -f "$tmp"; return 0; fi

            set +e
            if [[ "$method" == "singlecwd" ]]; then
              curl "${probe_common[@]}" --ftp-method singlecwd --output "$tmp" "$url" >/dev/null 2>&1
            elif [[ "$method" == "nocwd" ]]; then
              curl "${probe_common[@]}" --ftp-method nocwd --output "$tmp" "$url" >/dev/null 2>&1
            else
              curl "${probe_common[@]}" --output "$tmp" "$url" >/dev/null 2>&1
            fi
            local grc=$?
            set -e
            if [[ $grc -eq 0 ]] && cmp -s /tmp/residim-health.txt "$tmp"; then rm -f "$tmp"; return 0; fi
            rm -f "$tmp"
            return 1
          }

          root=""
          ftp_method=""
          for method in "singlecwd" "nocwd" "default"; do
            if probe_root "" "$method"; then
              root="."
              ftp_method="$method"
              break
            fi
          done

          # If the account is not jailed directly to the document root, try only
          # conventional document roots. No raw FTP directory listing is exposed.
          if [[ -z "$root" ]]; then
            for candidate in "public_html" "public_html/residim.ir" "public_html/residim" "www" "htdocs" "httpdocs" "residim.ir" "domains/residim.ir/public_html"; do
              for method in "singlecwd" "nocwd" "default"; do
                if probe_root "$candidate/" "$method"; then
                  root="$candidate"
                  ftp_method="$method"
                  break 2
                fi
              done
            done
          fi

          if [[ -z "$root" ]]; then
            echo "No verified writable document root found. The isolated FTPS smoke folder works, but the web-root mapping for this FTP account is still unresolved."
            exit 1
          fi

          if [[ "$root" == "." ]]; then base=""; else base="$root/"; fi
          echo "Verified deploy root: ${root}"

          method_args=()
          [[ "$ftp_method" == "singlecwd" ]] && method_args=(--ftp-method singlecwd)
          [[ "$ftp_method" == "nocwd" ]] && method_args=(--ftp-method nocwd)

          upload() {
            local src="$1" dst="$2"
            local url="ftp://$server/${base}${dst}" rc=0 tmp
            tmp="$(mktemp)"
            set +e
            curl "${common[@]}" "${method_args[@]}" --ftp-create-dirs --upload-file "$src" "$url"
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              if curl "${probe_common[@]}" "${method_args[@]}" --output "$tmp" "$url" >/dev/null 2>&1 && cmp -s "$src" "$tmp"; then
                echo "Verified $dst after FTP completion code $rc"
              else
                rm -f "$tmp"
                echo "Failed to verify $dst"
                return "$rc"
              fi
            fi
            rm -f "$tmp"
          }

          # Publish dependencies first and HTML last.
          upload /tmp/residim-health.txt health.txt
          upload landing/landing.css assets/landing.css
          upload landing/landing.js assets/landing.js
          upload landing/residim-mark.svg assets/residim-mark.svg

          while IFS= read -r -d '' file; do
            rel="${file#app/}"
            [[ "$rel" == "storage/.gitkeep" ]] && continue
            [[ "$rel" == "api/config.local.php" ]] && continue
            upload "$file" "app/$rel"
          done < <(find app -type f -print0)

          upload /tmp/residim-health.txt app/health.txt
          upload landing/index.html index.html

          # Keep /test snapshots, publish dependencies then pages and index last.
          while IFS= read -r -d '' file; do
            upload "$file" "$file"
          done < <(find test -type f ! -name '*.html' ! -name '*.md' ! -name 'hashes.json' ! -name 'tests.json' -print0)
          while IFS= read -r -d '' file; do
            upload "$file" "$file"
          done < <(find test -mindepth 2 -type f -name '*.html' -print0)
          upload test/offline.html test/offline.html
          upload test/index.html test/index.html

          # Successful STOR also needs byte-for-byte read-back for test files.
          while IFS= read -r -d '' file; do
            tmp_test="$(mktemp)"
            curl "${probe_common[@]}" "${method_args[@]}" --output "$tmp_test" "ftp://$server/${base}${file}"
            cmp -s "$file" "$tmp_test" || { echo "Test read-back mismatch: $file"; rm -f "$tmp_test"; exit 1; }
            rm -f "$tmp_test"
          done < <(find test -type f ! -name '*.md' ! -name 'hashes.json' ! -name 'tests.json' -print0)

          tmp_root="$(mktemp)"
          tmp_app="$(mktemp)"
          curl "${probe_common[@]}" "${method_args[@]}" --output "$tmp_root" "ftp://$server/${base}health.txt"
          curl "${probe_common[@]}" "${method_args[@]}" --output "$tmp_app" "ftp://$server/${base}app/health.txt"
          grep -F "commit=$GITHUB_SHA" "$tmp_root"
          grep -F "commit=$GITHUB_SHA" "$tmp_app"
          rm -f "$tmp_root" "$tmp_app"
          echo "Residim landing and /app FTP byte verification passed."
