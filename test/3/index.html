<!doctype html><html lang="fa" dir="rtl" data-skin="soft"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101524"><title>هفته روشن | رسیدیم</title><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../assets/v1/icon.svg"><link rel="stylesheet" href="../assets/v1/base.css"><style>.material{padding-block:56px}.welcome{max-width:850px}.welcome h1{font-size:clamp(2.7rem,5vw,4.2rem)}.week-sheet{margin-top:40px;background:var(--surface);border-radius:36px;padding:32px;border:1px solid var(--line)}.week-top{display:flex;justify-content:space-between;gap:20px;align-items:center}.daylist{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.daylist button{background:var(--bg);border:1px solid var(--line);border-radius:24px;color:var(--text);text-align:right;padding:24px;display:flex;flex-direction:column;gap:12px}.daylist button strong{font-size:1.5rem}.daylist [aria-pressed=true]{border:2px solid var(--accent);box-shadow:0 0 0 3px var(--bg)}.week-bottom{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}@media(max-width:720px){.week-sheet{padding:20px}.daylist{grid-template-columns:1fr}.daylist button{flex-direction:row;align-items:center;justify-content:space-between;padding:20px}.daylist button strong{font-size:1.1rem}}</style></head><body><div class="wrap"><header class="labbar"><a class="brand" href="../">رسیدیم / آزمایشگاه</a><div class="controls"><label for="appearance">ظاهر</label><select id="appearance" data-appearance><option value="dark">تیره</option><option value="light">روشن</option><option value="soft" selected>نرم</option></select><button class="action secondary" data-favorite="3">انتخاب این طرح</button></div></header><main><section class="material"><div class="welcome"><p class="tag">رسیدیم؛ نوبت‌ها روشن، خیال‌ها جمع</p><h1>این هفته،<br>کنار هم هستیم.</h1><p>یک نگاه کافی است تا بدانید نوبت بعدی با کیست.</p></div><section class="week-sheet"><div class="week-top"><h2>برنامه هفته</h2><span>رفت · ۷:۱۰</span></div><div class="daylist" role="group" aria-label="روزهای برنامه"><button data-day="شنبه" data-driver="۱" aria-pressed="true"><span>شنبه</span><strong>همیار ۱</strong><span>آماده</span></button><button data-day="یکشنبه" data-driver="۲" aria-pressed="false"><span>یکشنبه</span><strong>همیار ۲</strong><span>آماده</span></button><button data-day="دوشنبه" data-driver="۳" aria-pressed="false"><span>دوشنبه</span><strong>همیار ۳</strong><span>آماده</span></button></div><p data-day-output aria-live="polite">شنبه، ساعت ۷:۱۰؛ همیار ۱ — برنامه نمونه</p><div class="week-bottom"><p>گاهی برنامه عوض می‌شود؛ همراهی ادامه دارد.</p><button class="action" data-preview>جایگزین می‌خواهم</button></div></section></section></main><footer class="footer"><a href="../">همه تست‌ها</a><span>نمونه طراحی؛ داده‌ها ساختگی‌اند</span></footer><p class="status" data-status role="status" aria-live="polite"></p></div><script src="../assets/v1/lab.js"></script></body></html>
