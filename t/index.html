<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>طرح‌های رسیدیم</title><link rel="icon" href="01/assets/icon.svg"><link rel="stylesheet" href="01/assets/styles.css"><style>.lab-intro{padding:70px 0 35px}.lab-intro h1{font-size:clamp(2.5rem,5vw,4.3rem)}.lab-intro p{margin-top:20px;max-width:52ch}.test-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:80px}.test-button{display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:165px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}.test-button:hover{border-color:var(--accent)}.test-number{font-size:2.2rem;color:var(--accent)}.test-button small{color:var(--muted)}@media(max-width:600px){.test-button{padding:16px 10px;min-height:145px;font-size:.83rem}.test-button small{font-size:.67rem}.test-number{font-size:1.6rem}.test-grid{gap:8px}}</style></head><body><header class="site-header shell"><a class="brand" href="./"><img src="01/assets/icon.svg" width="36" height="36" alt="">رسیدیم / طرح‌ها</a></header><main class="shell"><section class="lab-intro"><h1>هر بار، یک نگاه تازه<br>به رسیدیم.</h1><p>طرح‌ها را تجربه کنید و بگویید کدام را بیشتر می‌پسندید. تست جدید در بالای فهرست قرار می‌گیرد.</p></section><nav class="test-grid" aria-label="تست‌های رسیدیم"><a class="test-button" href="01/"><span class="test-number">۰۱</span><strong>قرار مشترک</strong><small>لندینگ + تجربه هفته، حساب و گروه</small></a></nav></main><footer class="site-footer shell"><span>تست‌های مستقل؛ انتخاب با شما.</span><a href="../app/">اپ اصلی رسیدیم</a></footer></body></html>
